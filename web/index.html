<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#2e62f0" />
<title>好队友 · 工作台</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="ui.css" />
<script src="sync.js"></script>
<style>
  :root{--side:#101729;--side-hi:#1b2438;--side-mut:#8e9bb3;--side-line:rgba(255,255,255,.08)}
  a{text-decoration:none}
  .nav button,.topbar .tbtn,.act,.ob-step{transition:transform .08s ease,background .15s ease,box-shadow .12s ease,border-color .12s ease}
  .nav button:active,.topbar .tbtn:active{transform:scale(.97)}
  .act:active{transform:translateY(0) scale(.99)}
  /* auth gate */
  .auth{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;
    background:radial-gradient(1100px 600px at 12% -10%,#3f63f0 0%,transparent 55%),
               radial-gradient(900px 600px at 105% 110%,#3127a0 0%,transparent 55%),
               linear-gradient(150deg,#17224d,#3730a3)}
  .auth.show{display:flex}
  .auth-card{background:#fff;border-radius:22px;box-shadow:var(--shadow-lg);width:410px;max-width:94vw;padding:32px 30px;animation:authIn .3s ease;position:relative}
  @keyframes authIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .auth-card .x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;border:0;background:var(--bg);color:var(--muted);cursor:pointer;font-size:13px;display:none;align-items:center;justify-content:center}
  .auth-card .x:hover{background:var(--danger-weak);color:var(--danger)}
  .auth-card .x.show{display:flex}
  .auth-card .logo{width:50px;height:50px;border-radius:15px;background:var(--accent-grad);display:flex;align-items:center;justify-content:center;font-size:25px;color:#fff;margin-bottom:16px;box-shadow:0 6px 16px -4px var(--accent-glow)}
  .auth-card h2{margin:0 0 4px;font-size:21px}
  .auth-card .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .auth-card label{display:block;font-size:12px;color:var(--muted);margin:13px 0 5px;font-weight:600}
  .auth-card input{width:100%;padding:11px 13px;border:1px solid var(--border-strong);border-radius:10px;font-size:14px;transition:border-color .15s,box-shadow .15s}
  .auth-card input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
  .auth-card .go{width:100%;margin-top:20px;padding:12px;background:var(--accent-grad);color:#fff;border:0;border-radius:11px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px -3px var(--accent-glow);transition:filter .15s,transform .08s}
  .auth-card .go:hover{filter:brightness(1.06)}
  .auth-card .go:active{transform:scale(.98)}
  .auth-card .go:disabled{opacity:.6;cursor:default}
  .auth-card .alt{text-align:center;margin-top:15px;font-size:13px;color:var(--muted)}
  .auth-card .alt a{color:var(--accent);cursor:pointer;font-weight:600}
  .auth-card .err{background:var(--danger-weak);color:var(--danger);border-radius:9px;padding:9px 11px;font-size:13px;margin-top:14px;display:none}
  .auth-card .err.show{display:block}
  .auth-card .demo{text-align:center;margin-top:16px;font-size:12px}
  .auth-card .demo a{color:var(--muted);cursor:pointer;text-decoration:underline}
  .shell{display:flex;height:100vh;height:100dvh;overflow:hidden}
  /* sidebar */
  .side{width:228px;flex:0 0 auto;background:linear-gradient(180deg,#121a30 0%,var(--side) 30%);color:#fff;display:flex;flex-direction:column;transition:width .18s}
  .side .brand{display:flex;align-items:center;gap:11px;padding:16px;border-bottom:1px solid var(--side-line)}
  .side .brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent-grad);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto;box-shadow:0 4px 10px -2px var(--accent-glow)}
  .side .brand b{font-size:15px;white-space:nowrap;letter-spacing:.3px}
  .side .brand .sub{font-size:11px;color:var(--side-mut);white-space:nowrap}
  .nav{flex:1;overflow:auto;padding:10px;scrollbar-color:#3a4456 transparent}
  .nav .sep{color:var(--side-mut);font-size:10.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;padding:16px 12px 6px;white-space:nowrap}
  .nav button{width:100%;display:flex;align-items:center;gap:11px;background:none;border:0;color:#c3cce0;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;text-align:left;margin-bottom:1px;position:relative}
  .nav button .ic{font-size:16px;width:21px;text-align:center;flex:0 0 auto;opacity:.92}
  .nav button .lbl{white-space:nowrap;overflow:hidden;flex:1}
  .nav button .badge{background:var(--danger);color:#fff;border-radius:10px;font-size:10px;font-weight:700;padding:1px 6px;min-width:17px;text-align:center;display:none}
  .nav button .badge.show{display:inline-block}
  .nav button:hover{background:var(--side-hi);color:#fff}
  .nav button.on{background:linear-gradient(135deg,rgba(86,118,255,.26),rgba(79,70,229,.16));color:#fff;font-weight:600}
  .nav button.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent-grad)}
  .side .foot{padding:10px;border-top:1px solid var(--side-line)}
  .side .foot .lgn{width:100%;display:none;align-items:center;justify-content:center;gap:7px;background:rgba(86,118,255,.16);border:1px solid rgba(108,134,255,.4);color:#cdd8ff;padding:8px;border-radius:10px;cursor:pointer;font-size:12.5px;font-weight:600;margin-bottom:8px;transition:background .15s}
  .side .foot .lgn:hover{background:rgba(86,118,255,.3);color:#fff}
  .side .foot .me{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:10px}
  .side .foot .me:hover{background:var(--side-hi)}
  .side .foot .me .av{width:30px;height:30px;border-radius:50%;background:var(--accent-grad);display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto}
  .side .foot .me .nm{font-size:13px;white-space:nowrap;overflow:hidden}
  .side .foot .me .sw{margin-left:auto;color:var(--side-mut);cursor:pointer;font-size:11px;white-space:nowrap;padding:3px 7px;border:1px solid var(--side-line);border-radius:7px}
  .side .foot .me .sw:hover{color:#fff;border-color:var(--side-mut)}
  /* collapsed */
  .shell.collapsed .side{width:64px}
  .shell.collapsed .side .brand b,.shell.collapsed .side .brand .sub,
  .shell.collapsed .nav .lbl,.shell.collapsed .nav .sep,.shell.collapsed .nav .badge,
  .shell.collapsed .foot .nm,.shell.collapsed .foot .sw,.shell.collapsed .foot .lgn{display:none}
  .shell.collapsed .nav button{justify-content:center}
  /* main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:54px;padding:0 16px;gap:12px}
  .topbar .ham{border:0;background:none;font-size:18px;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:8px}
  .topbar .ham:hover{background:var(--bg);color:var(--text)}
  .topbar .crumb{font-weight:650;font-size:15.5px}
  .mode-pill{display:none;align-items:center;gap:8px;background:var(--amber-weak);color:var(--amber);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;white-space:nowrap}
  .mode-pill a{color:var(--accent);cursor:pointer;font-weight:700}
  .mode-pill a:hover{text-decoration:underline}
  .topbar .tbtn{border:1px solid var(--border-strong);background:#fff;color:var(--text);padding:7px 14px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500}
  .topbar .tbtn:hover{border-color:var(--accent);color:var(--accent)}
  .topbar .tbtn.primary{background:var(--accent-grad);border-color:transparent;color:#fff;box-shadow:0 2px 8px -1px var(--accent-glow)}
  .topbar .tbtn.primary:hover{filter:brightness(1.06);color:#fff}
  .content{flex:1;min-height:0;position:relative;background:var(--bg)}
  iframe#frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none;opacity:0;transition:opacity .2s ease}
  iframe#frame.show{display:block;opacity:1}
  iframe#frame.loading{opacity:0}
  /* loading shimmer while a module frame boots (kills the white flash) */
  .floader{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:var(--bg);z-index:2}
  .floader.show{display:flex}
  .floader .spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* overview */
  .ov{position:absolute;inset:0;overflow:auto;padding:26px;display:none}
  .ov.show{display:block;animation:fadeUp .26s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .ov .head{display:flex;align-items:flex-end;gap:12px;margin-bottom:20px;max-width:1020px}
  .ov .head h1{margin:0;font-size:22px;letter-spacing:.2px}
  .ov .head .date{color:var(--muted);font-size:13px;margin-bottom:3px}
  /* onboarding checklist */
  .ob{background:linear-gradient(135deg,#f0f4ff 0%,#f6f2ff 100%);border:1px solid #dee7fb;border-radius:var(--r-lg);padding:18px 18px 16px;margin-bottom:20px;max-width:1020px;position:relative;box-shadow:var(--shadow-sm)}
  .ob .ob-x{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(255,255,255,.7);color:var(--muted);cursor:pointer;font-size:12px}
  .ob .ob-x:hover{background:#fff;color:var(--danger)}
  .ob .ob-head{display:flex;align-items:center;gap:12px;margin-bottom:13px;padding-right:30px}
  .ob h2{margin:0;font-size:15px}
  .ob .ob-sub{color:var(--muted);font-size:12px}
  .ob .ob-prog{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
  .ob .ob-track{width:90px;height:6px;border-radius:4px;background:rgba(46,98,240,.15);overflow:hidden}
  .ob .ob-fill{height:100%;border-radius:4px;background:var(--accent-grad);transition:width .3s ease}
  .ob-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .ob-step{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 13px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
  .ob-step:hover{border-color:#b9ccfb;box-shadow:var(--shadow-sm);transform:translateY(-1px)}
  .ob-step .oic{width:34px;height:34px;border-radius:10px;background:var(--accent-weak);display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
  .ob-step h4{margin:0 0 2px;font-size:13px;display:flex;align-items:center;gap:5px}
  .ob-step p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.45}
  .ob-step.done{background:#f4fcf7;border-color:#cdeeda}
  .ob-step.done .oic{background:var(--green-weak)}
  .ob-step.done h4{color:var(--green)}
  .ob-step .ck{margin-left:auto;color:var(--green);font-weight:700;flex:0 0 auto;font-size:13px}
  /* quick actions */
  .ov-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;max-width:1020px}
  .act{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:17px 18px;cursor:pointer;position:relative;box-shadow:var(--shadow-sm)}
  .act:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:#b9ccfb}
  .act .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;color:#fff;flex:0 0 auto}
  .act .ic.blue{background:linear-gradient(135deg,#3f7bf7,#4f46e5);box-shadow:0 6px 14px -4px var(--accent-glow)}
  .act .ic.green{background:linear-gradient(135deg,#27c277,#0a8f4e);box-shadow:0 6px 14px -4px rgba(12,157,92,.5)}
  .act .ic.purple{background:linear-gradient(135deg,#8d6bff,#5b34d6);box-shadow:0 6px 14px -4px rgba(107,70,193,.5)}
  .act h3{margin:0 0 3px;font-size:15.5px}.act p{margin:0;color:var(--muted);font-size:12.5px}
  .act .arrow{margin-left:auto;color:var(--border-strong);font-size:17px;transition:transform .15s,color .15s}
  .act:hover .arrow{transform:translateX(3px);color:var(--accent)}
  .act .nbadge{position:absolute;top:-8px;right:12px;background:var(--danger);color:#fff;border-radius:11px;font-size:11px;font-weight:700;padding:2px 9px;display:none;box-shadow:0 3px 8px -2px rgba(229,72,77,.6)}
  .act .nbadge.show{display:block}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;max-width:1020px}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 15px;box-shadow:var(--shadow-sm)}
  .kpi .n{font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .kpi .l{color:var(--muted);font-size:12px;margin-top:6px}
  .kpi .n.amber{color:var(--amber)}.kpi .n.green{color:var(--green)}.kpi .n.danger{color:var(--danger)}
  .panels{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1020px}
  .pnl{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:15px 17px;box-shadow:var(--shadow-sm)}
  .pnl h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center}
  .pnl h3 .more{margin-left:auto;font-size:12px;color:var(--accent);cursor:pointer;font-weight:500}
  .pnl h3 .more:hover{text-decoration:underline}
  .li{display:flex;align-items:center;gap:11px;padding:10px 6px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:8px;margin:0 -6px}
  .li:hover{background:#f7faff}
  .li:last-child{border-bottom:0}
  .li .av{width:32px;height:32px;border-radius:9px;background:var(--accent-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto}
  .li .g{flex:1;min-width:0}.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li .s{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li .time{color:var(--muted);font-size:11px;white-space:nowrap}
  .pnl .empty{color:var(--muted);text-align:center;padding:26px 8px;font-size:13px}
  .pnl .empty .big{display:none}
  /* mobile */
  .scrim{position:fixed;inset:0;background:rgba(10,16,28,.45);z-index:18;display:none}
  @media(max-width:860px){
    .ov{padding:16px}
    .ov-actions{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}.panels{grid-template-columns:1fr}
    .ob-steps{grid-template-columns:1fr 1fr}
    .side{position:fixed;z-index:20;height:100%;transform:translateX(-100%);box-shadow:var(--shadow-lg)}
    .shell.mopen .side{transform:translateX(0)}
    .shell.mopen .scrim{display:block}
    .shell.collapsed .side{width:228px}
  }
  @media(max-width:640px){ #newForm{display:none} .mode-pill{display:none!important} .kpis{grid-template-columns:repeat(2,1fr)} .ob-steps{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="auth" id="auth">
  <div class="auth-card">
    <button class="x" id="authClose" aria-label="关闭">✕</button>
    <div class="logo">✓</div>
    <h2 id="authTitle">登录 好队友</h2>
    <div class="sub" id="authSub">低代码审批工作台 · 团队协作版</div>
    <div id="authFields"></div>
    <button class="go" id="authGo">登录</button>
    <div class="err" id="authErr"></div>
    <div class="alt" id="authAlt"></div>
    <div class="demo" id="authDemo"><a id="demoLink">跳过，先用本地演示模式 →</a></div>
  </div>
</div>
<div class="shell" id="shell">
  <aside class="side">
    <div class="brand"><div class="logo">✓</div><div><b>好队友</b><div class="sub">低代码工作台</div></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <button class="lgn" id="meLogin">🔑 登录 / 注册团队</button>
      <div class="me"><div class="av" id="meAv">我</div><div class="nm" id="meNm">我</div><span class="sw" id="meSwitch">切换</span></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <div class="topbar">
      <button class="ham" id="ham" aria-label="切换导航栏">☰</button>
      <span class="crumb" id="crumb">概览</span>
      <span class="mode-pill" id="modePill"></span>
      <span class="spacer"></span>
      <button class="tbtn" id="newForm">＋ 新建表单</button>
      <button class="tbtn primary" id="quickFill">发起填报</button>
    </div>
    <div class="content">
      <div class="ov" id="overview"></div>
      <div class="floader" id="floader"><div class="spin"></div></div>
      <iframe id="frame" title="模块"></iframe>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   好队友 · application shell.
   The root is a persistent frame: sidebar + topbar, with the content area
   swapping modules in place (via iframe) and a native "overview" landing
   with an onboarding checklist. All modules share localStorage on this origin.
   ========================================================================= */
const NAV=[
  {id:'overview',icon:'🏠',label:'概览',native:true},
  {id:'todo',icon:'✅',label:'待办审批',src:'app.html?tab=todo',badge:'pending'},
  {id:'msg',icon:'🔔',label:'消息中心',src:'app.html?tab=msg',badge:'unread'},
  {sep:'数据'},
  {id:'manage',icon:'📊',label:'数据管理',src:'manage.html'},
  {id:'views',icon:'▦',label:'看板 / 多视图',src:'views.html'},
  {id:'dashboard',icon:'📈',label:'数据看板',src:'dashboard.html'},
  {sep:'设计'},
  {id:'form',icon:'🧩',label:'表单设计器',src:'form.html'},
  {id:'flow',icon:'🔀',label:'审批流程',src:'flow.html'},
  {sep:'团队',authed:true},
  {id:'team',icon:'👥',label:'团队管理',src:'team.html',authed:true},
  {sep:''},
  {id:'mobile',icon:'📱',label:'在手机中打开',href:'app.html',blank:true},
];
const NAV_MAP=Object.fromEntries(NAV.filter(n=>n.id).map(n=>[n.id,n]));
// routes reachable from the topbar but not shown in the sidebar
NAV_MAP.fill={id:'fill',label:'发起填报',src:'app.html?tab=workbench'};

const read=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v;}catch(e){return f;}};
const write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const LAYOUT=['subtable','columns','group','divider','static_text','tabs','collapse','steps'];
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function currentStep(i){return i.steps&&i.steps[i.cursor];}
function isPending(i){const s=currentStep(i);return i.status==='running'&&s&&s.kind==='approval'&&s.status==='pending';}
function rel(ts){const d=Date.now()-ts;if(d<60000)return '刚刚';if(d<3600000)return Math.floor(d/60000)+'分钟前';if(d<86400000)return Math.floor(d/3600000)+'小时前';const x=new Date(ts);return (x.getMonth()+1)+'-'+('0'+x.getDate()).slice(-2);}
function statusPill(s){return s==='approved'?'<span class="pill ok">已通过</span>':s==='rejected'?'<span class="pill no">已驳回</span>':'<span class="pill run">审批中</span>';}

/* ---- sidebar ---- */
function renderNav(){
  const el=document.getElementById('nav');
  const authed=!!(window.HDY&&HDY.isAuthed());
  el.innerHTML=NAV.filter(n=>!n.authed||authed).map(n=> n.sep!==undefined
    ? `<div class="sep">${esc(n.sep||'')}</div>`
    : `<button data-id="${n.id}" title="${esc(n.label)}"><span class="ic">${n.icon}</span><span class="lbl">${esc(n.label)}</span>${n.badge?`<span class="badge" data-badge="${n.badge}"></span>`:''}</button>`
  ).join('');
  el.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{
    const n=NAV_MAP[b.dataset.id];
    if(n.href){ window.open(n.href, n.blank?'_blank':'_self'); return; }
    go(b.dataset.id);
    if(window.innerWidth<=860) document.getElementById('shell').classList.remove('mopen');
  });
}
function setActive(id){ document.querySelectorAll('.nav button[data-id]').forEach(b=>b.classList.toggle('on',b.dataset.id===id)); }
function updateBadges(){
  const instances=read('hdy.instances.v1',[]); const notifs=read('hdy.notif.v1',[]);
  const counts={pending:instances.filter(isPending).length, unread:notifs.filter(n=>!n.read).length};
  document.querySelectorAll('[data-badge]').forEach(b=>{const n=counts[b.dataset.badge]||0;b.textContent=n>99?'99+':n;b.classList.toggle('show',n>0);});
}

/* ---- router ---- */
function go(id){ if(location.hash.slice(1)!==id) location.hash=id; else route(); }
function route(){
  const id=(location.hash.slice(1)||'overview');
  const n=NAV_MAP[id]||NAV_MAP.overview;
  if(n.href){ setActive('overview'); location.hash='overview'; return; }
  document.getElementById('crumb').textContent=n.label;
  setActive(n.id);
  const ov=document.getElementById('overview'), fr=document.getElementById('frame'), fl=document.getElementById('floader');
  if(n.native){ fr.classList.remove('show'); fl.classList.remove('show'); ov.classList.add('show'); renderOverview(); }
  else{
    ov.classList.remove('show');
    const src=n.src;
    if(fr.getAttribute('src')!==src){ fl.classList.add('show'); fr.classList.remove('show'); fr.setAttribute('src',src); }
    else { fr.classList.add('show'); fl.classList.remove('show'); }
  }
}
window.addEventListener('hashchange',route);
// hide the loader once the framed module finishes booting
document.getElementById('frame').addEventListener('load',()=>{ document.getElementById('floader').classList.remove('show'); document.getElementById('frame').classList.add('show'); });

/* ---- onboarding checklist ---- */
function obSteps(){
  const FORM=read('hdy.formbuilder.v1',null), FLOW=read('hdy.flow.v1',null);
  const instances=read('hdy.instances.v1',[]);
  const fieldCount=FORM&&Array.isArray(FORM.fields)?FORM.fields.filter(f=>!LAYOUT.includes(f.type)).length:0;
  let nodeCount=0;(function walk(ch){if(!ch)return;ch.forEach(x=>{nodeCount++;if(x.type==='condition')(x.branches||[]).forEach(b=>walk(b.children));});})(FLOW?FLOW.root:[]);
  const acted=instances.some(i=>i.status==='approved'||i.status==='rejected'||(i.steps||[]).some(s=>s.actedAt));
  return [
    {done:fieldCount>0,   icon:'🧩', t:'设计表单',     s:'添加字段，搭好数据结构', go:'form'},
    {done:nodeCount>0,    icon:'🔀', t:'配置审批流程', s:'设定审批人与条件分支',   go:'flow'},
    {done:instances.length>0, icon:'📝', t:'发起一笔填报', s:'像员工一样提交一张单据', go:'fill'},
    {done:acted,          icon:'✅', t:'完成一次审批', s:'在待办中同意或驳回',     go:'todo'},
  ];
}
function obHtml(){
  if(localStorage.getItem('hdy.onboard.hide')==='1') return '';
  const steps=obSteps(); const done=steps.filter(s=>s.done).length;
  if(done===steps.length) return '';
  return `<div class="ob">
    <button class="ob-x" id="obHide" title="不再显示">✕</button>
    <div class="ob-head"><div><h2>🚀 四步上手 好队友</h2><div class="ob-sub">从建表到跑通第一条审批，大约 3 分钟</div></div>
      <div class="ob-prog"><span>${done}/${steps.length}</span><div class="ob-track"><div class="ob-fill" style="width:${done/steps.length*100}%"></div></div></div></div>
    <div class="ob-steps">${steps.map((s,i)=>`
      <div class="ob-step ${s.done?'done':''}" data-go="${s.go}">
        <div class="oic">${s.done?'✓':s.icon}</div>
        <div class="grow"><h4>${i+1}. ${s.t}${s.done?'<span class="ck">已完成</span>':''}</h4><p>${s.s}</p></div>
      </div>`).join('')}</div>
  </div>`;
}

/* ---- overview ---- */
/* signature of rendered data — skip no-op re-renders on focus/storage so a
   re-render can't replace the DOM mid-click and swallow the user's tap */
function snapshot(){ return ['hdy.formbuilder.v1','hdy.flow.v1','hdy.instances.v1','hdy.notif.v1','hdy.user.v1','hdy.onboard.hide'].map(k=>localStorage.getItem(k)||'').join(' '); }
let lastSnap='';
function ovShowing(){ return document.getElementById('overview').classList.contains('show'); }
function renderOverview(){
  lastSnap=snapshot();
  updateBadges();
  const FORM=read('hdy.formbuilder.v1',null), FLOW=read('hdy.flow.v1',null);
  const instances=read('hdy.instances.v1',[]), notifs=read('hdy.notif.v1',[]);
  const me=read('hdy.user.v1','我');
  const fieldCount=FORM&&Array.isArray(FORM.fields)?FORM.fields.filter(f=>!LAYOUT.includes(f.type)).length:0;
  let nodeCount=0;(function walk(ch){if(!ch)return;ch.forEach(x=>{nodeCount++;if(x.type==='condition')(x.branches||[]).forEach(b=>walk(b.children));});})(FLOW?FLOW.root:[]);
  const running=instances.filter(i=>i.status==='running').length;
  const approved=instances.filter(i=>i.status==='approved').length;
  const pending=instances.filter(isPending).length;
  const recent=instances.slice(0,6);
  const pend=instances.filter(isPending).slice(0,6);
  const now=new Date(); const dstr=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
  const hour=now.getHours(); const greet=hour<5?'夜深了':hour<11?'早上好':hour<14?'中午好':hour<18?'下午好':'晚上好';

  const ov=document.getElementById('overview');
  ov.innerHTML=`
    <div class="head"><div><div class="date">${dstr}</div><h1>${greet}，${esc(me)} 👋</h1></div></div>
    ${obHtml()}
    <div class="ov-actions">
      <div class="act" data-go="manage"><div class="ic blue">📋</div><div><h3>查看数据</h3><p>浏览所有提交记录、看板与报表</p></div><span class="arrow">›</span></div>
      <div class="act" data-go="todo"><div class="ic green">✅</div><div><h3>去审批</h3><p>处理待你审批的单据</p></div><span class="arrow">›</span><span class="nbadge ${pending?'show':''}">${pending} 待办</span></div>
      <div class="act" data-go="form"><div class="ic purple">🧩</div><div><h3>设计新表单</h3><p>拖拽搭建表单与审批流程</p></div><span class="arrow">›</span></div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="n">${instances.length}</div><div class="l">提交记录</div></div>
      <div class="kpi"><div class="n amber">${running}</div><div class="l">审批中</div></div>
      <div class="kpi"><div class="n green">${approved}</div><div class="l">已通过</div></div>
      <div class="kpi"><div class="n danger">${pending}</div><div class="l">待我审批</div></div>
      <div class="kpi"><div class="n">${fieldCount}/${nodeCount}</div><div class="l">字段 / 审批节点</div></div>
    </div>
    <div class="panels">
      <div class="pnl"><h3>最近提交 <span class="more" data-go="manage">全部 ›</span></h3>
        ${recent.length? recent.map(i=>`<div class="li" data-open="${i.id}"><div class="av">${esc((i.title||'单')[0])}</div>
            <div class="g"><div class="t">${i.no?esc(i.no)+' · ':''}${esc(i.title||'记录')}</div><div class="s">发起人 ${esc(i.initiator||'')}</div></div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">${statusPill(i.status)}<div class="time">${rel(i.createdAt)}</div></div></div>`).join('')
          : `<div class="empty">还没有提交。${fieldCount?'去 <a data-go="fill">发起一次填报</a>':'先 <a data-go="form">设计一个表单</a>'}</div>`}
      </div>
      <div class="pnl"><h3>待我审批 <span class="more" data-go="todo">去处理 ›</span></h3>
        ${pend.length? pend.map(i=>{const s=currentStep(i);return `<div class="li" data-go2="todo"><div class="av" style="background:var(--amber)">审</div>
            <div class="g"><div class="t">${esc(i.title||'记录')}</div><div class="s">环节「${esc(s?s.name:'')}」· 发起人 ${esc(i.initiator||'')}</div></div>
            <div class="time">${rel(i.createdAt)}</div></div>`}).join('')
          : `<div class="empty">🎉 暂无待办审批</div>`}
      </div>
    </div>`;
  ov.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(e.dataset.go));
  ov.querySelectorAll('[data-go2]').forEach(e=>e.onclick=()=>go(e.dataset.go2));
  ov.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>{ go('manage'); });
  const ox=ov.querySelector('#obHide'); if(ox) ox.onclick=(e)=>{ e.stopPropagation(); localStorage.setItem('hdy.onboard.hide','1'); renderOverview(); };
}

/* ---- identity + mode ---- */
let serverAlive=false;
function paintMe(){
  const me=read('hdy.user.v1','我'); const meta=read('hdy.auth.me',null);
  document.getElementById('meNm').textContent=me; document.getElementById('meAv').textContent=(me[0]||'我');
  // when signed into a real org, show org + role and offer logout instead of "switch"
  const sw=document.getElementById('meSwitch');
  if(meta&&meta.org){ document.querySelector('.side .foot .me .nm').title=meta.org.name+' · '+roleLabel(meta.role); sw.textContent='退出'; sw.dataset.mode='logout'; }
  else { sw.textContent='切换'; sw.dataset.mode='switch'; }
  paintMode();
}
function paintMode(){
  const authed=!!(window.HDY&&HDY.isAuthed());
  const pill=document.getElementById('modePill'), lgn=document.getElementById('meLogin');
  if(authed){ pill.style.display='none'; lgn.style.display='none'; return; }
  pill.style.display='inline-flex';
  pill.innerHTML='本地演示模式 · 数据保存在本机'+(serverAlive?'　<a id="pillLogin">登录团队 →</a>':'');
  const a=pill.querySelector('#pillLogin'); if(a) a.onclick=()=>showAuth();
  lgn.style.display=serverAlive?'flex':'none'; lgn.onclick=()=>showAuth();
}
function roleLabel(r){ return ({owner:'所有者',admin:'管理员',member:'成员',viewer:'访客'})[r]||r; }
document.getElementById('meSwitch').onclick=()=>{
  const sw=document.getElementById('meSwitch');
  if(sw.dataset.mode==='logout'){ if(confirm('退出登录？')){ HDY.logout(); location.reload(); } return; }
  const v=prompt('切换当前身份（用于发起/审批）', read('hdy.user.v1','我')); if(v&&v.trim()){ write('hdy.user.v1',v.trim()); paintMe(); if(!location.hash||location.hash==='#overview') renderOverview(); }
};

/* ---- auth gate ---- */
let authMode='login';
function showAuth(){ document.getElementById('auth').classList.add('show'); document.getElementById('authClose').classList.toggle('show',booted); renderAuth(); }
function hideAuth(){ document.getElementById('auth').classList.remove('show'); }
function renderAuth(){
  const login = authMode==='login';
  document.getElementById('authTitle').textContent = login?'登录 好队友':'创建你的团队';
  document.getElementById('authSub').textContent = login?'低代码审批工作台 · 团队协作版':'注册即创建一个组织，你是所有者';
  document.getElementById('authGo').textContent = login?'登录':'创建团队并注册';
  document.getElementById('authFields').innerHTML =
    (login?'':`<label>团队名称</label><input id="f_org" placeholder="如：Acme 公司" autocomplete="organization">
              <label>你的称呼</label><input id="f_name" placeholder="如：张三" autocomplete="name">`)+
    `<label>邮箱</label><input id="f_email" type="email" placeholder="you@company.com" autocomplete="email">
     <label>密码</label><input id="f_pw" type="password" placeholder="${login?'输入密码':'至少 6 位'}" autocomplete="${login?'current-password':'new-password'}">`;
  document.getElementById('authAlt').innerHTML = login
    ? `还没有账号？<a id="toSignup">创建团队 →</a>`
    : `已有账号？<a id="toLogin">去登录 →</a>`;
  const alt=document.getElementById('authAlt').querySelector('a');
  alt.onclick=()=>{ authMode=login?'signup':'login'; document.getElementById('authErr').classList.remove('show'); renderAuth(); };
  document.getElementById('f_email').focus();
}
function authErr(msg){ const e=document.getElementById('authErr'); e.textContent=msg; e.classList.add('show'); }
async function doAuth(){
  const btn=document.getElementById('authGo'); if(btn.disabled) return;
  btn.disabled=true; document.getElementById('authErr').classList.remove('show');
  const email=val('f_email'), pw=val('f_pw');
  try{
    if(authMode==='login') await HDY.login({email,password:pw});
    else await HDY.signup({email,password:pw,orgName:val('f_org'),name:val('f_name')});
    await HDY.pull().catch(()=>{});   // load org data into local store
    localStorage.removeItem('hdy.demoMode');
    hideAuth();
    if(booted) location.reload();     // logged in from demo mode → full re-init
    else bootApp();
  }catch(err){ authErr(err.message||'操作失败，请重试'); btn.disabled=false; }
}
function val(id){ const e=document.getElementById(id); return e?e.value.trim():''; }
document.getElementById('authGo').onclick=doAuth;
document.getElementById('auth').addEventListener('keydown',e=>{ if(e.key==='Enter') doAuth(); });
document.getElementById('authClose').onclick=hideAuth;
document.getElementById('demoLink').onclick=()=>{ localStorage.setItem('hdy.demoMode','1'); hideAuth(); bootApp(); };

/* ---- topbar / chrome ---- */
document.getElementById('newForm').onclick=()=>go('form');
document.getElementById('quickFill').onclick=()=>go('fill');   // 发起填报 → mobile workbench (fill)
document.getElementById('ham').onclick=()=>{
  const s=document.getElementById('shell');
  if(window.innerWidth<=860){ s.classList.toggle('mopen'); return; }
  s.classList.toggle('collapsed');
  localStorage.setItem('hdy.ui.side', s.classList.contains('collapsed')?'min':'full');
};
document.getElementById('scrim').onclick=()=>document.getElementById('shell').classList.remove('mopen');

/* refresh overview stats when the iframe’s data may have changed */
function refreshIfChanged(){ updateBadges(); if(ovShowing() && snapshot()!==lastSnap) renderOverview(); }
window.addEventListener('focus',refreshIfChanged);
// live sync: any module wrote shared data → refresh badges + overview instantly
window.addEventListener('storage',e=>{ if(e.key&&e.key.indexOf('hdy.')!==0)return; refreshIfChanged(); });
setInterval(updateBadges, 4000);   // safety net for the 待办 badge

/* ---- boot ---- */
let booted=false;
function bootApp(){
  if(booted) return; booted=true;
  if(localStorage.getItem('hdy.ui.side')==='min' && window.innerWidth>860) document.getElementById('shell').classList.add('collapsed');
  renderNav(); paintMe();
  if(!location.hash){ location.hash='overview'; }
  route();
  // if signed in, pull latest org data from server now + periodically.
  // (pull writes localStorage → iframes refresh via storage events; the shell
  //  isn't notified of its own writes, so refresh it explicitly here.)
  if(HDY.isAuthed()){
    HDY.pull().then(refreshIfChanged).catch(()=>{});
    setInterval(()=>HDY.pull().then(refreshIfChanged).catch(()=>{}), 15000);
  }
}
async function start(){
  // Decide: real auth vs local demo. Only show the login wall if a backend is
  // actually reachable — otherwise (static hosting like githack) boot locally.
  // The probe runs in the background so an authed/demo boot is never delayed.
  const probe=HDY.ping().then(ok=>{ serverAlive=ok; if(booted) paintMode(); return ok; });
  if(HDY.isAuthed()){ bootApp(); return; }
  if(localStorage.getItem('hdy.demoMode')==='1'){ bootApp(); return; }
  if(await probe){ showAuth(); } else { bootApp(); }
}
start();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
